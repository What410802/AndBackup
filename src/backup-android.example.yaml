# AndBackup site/device settings (UTF-8, simple top-level YAML).
# Copy this file to backup-android.yaml, then edit the copy. The copy is ignored
# by Git so an Android wireless endpoint and local paths are not committed.
adb: adb
adb_serial: ""
adb_connect: false
source_dir: "/storage/emulated/0/DCIM"
out: android-backup.tar.xz
compress: xz
source_mode: host-adb
# Required only for source_mode: device-python. This is a local path to an
# Android arm64 Python, either a single standalone interpreter binary or a
# python install prefix directory containing bin/<python> and lib/python3.x
# (the directory is packed and uploaded per run).
# device_python: "C:/tools/python-android-arm64/python"
# Optional for source_mode: device-python. When device_python is empty (or a
# path that does not exist yet) and this is true, backup.py downloads the
# pinned python-build-standalone arm64 interpreter from device_python_url and
# unpacks it: into device_python when set, else into the per-user cache
# (e.g. %LOCALAPPDATA%/andbackup). Reuses the cache on later runs. False by
# default, so a missing interpreter is an error unless this is enabled.
# download_device_python: true
# Optional: override the upstream download URL. Defaults to the pinned
# astral-sh/python-build-standalone release. May be a local .tar.zst file path
# for offline use (e.g. a file you already downloaded).
# device_python_url: "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.14.7+20260901-aarch64-unknown-linux-musl-lto+static-full.tar.zst"
log_level: info
progress_interval: 5
show_rate: false
# python: "C:/Path/To/python.exe"
