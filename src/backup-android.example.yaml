# AndBackup 配置示例：复制为 backup-android.yaml 后使用（该副本被 .gitignore 忽略，
# 不会随仓库包含设备 serial、无线端点或本机输出路径）。
# 开箱即可试用：只需把 source_dir 改成要备份的设备目录；out 指向一个目录时会自动
# 以“<source_dir 尾部名>.<压缩后缀>”命名（此处为 ./backups/DCIM.tar.xz），留空则写
# 当前目录的 backup.tar.xz，直接写文件名亦可（后缀与 compress 不符时交互询问是否补全）。
# 推荐模式 device-python：download_device_python: true 会在首跑联网下载与设备 ABI
# 匹配的解释器并缓存到 /data/local/tmp/andbackup-pyenv，之后自动复用。device-python
# 失败只会明确报错，不会自动退回 host-adb；完全离线时改 source_mode: host-adb 并删掉
# download_device_python 行。键值完整说明见 README.md 与 docs/configuration.md
# （English: docs/configuration.en.md）。
adb: adb
device: ""
source_dir: "/storage/emulated/0/DCIM"
out: "./backups/"
compress: xz
source_mode: device-python
download_device_python: true
log_level: info
progress_interval: 5
show_rate: false
