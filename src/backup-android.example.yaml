# AndBackup 配置示例：复制为 backup-android.yaml 后使用（该副本被 .gitignore 忽略，
# 不会随仓库包含设备 serial、无线端点或本机输出路径）。
#
# 开箱即可试用：只需把 source_dir 改成要备份的设备目录；out 指向一个目录时会自动
# 以“<source_dir 尾部名>.<压缩后缀>”命名（此处为 ./backups/DCIM.tar.xz，若目录不存在会
# 自动创建），留空则写当前目录的 backup.tar.xz，直接写文件名亦可（后缀与 compress 不符时
# 交互询问是否补全）。相对路径都相对“运行命令时的工作目录”，不是本文件所在目录。
#
# 目标文件（含后缀）已存在时，交互终端会先问是否覆写（默认不覆写）；非交互环境直接报错
# 退出，免得无人值守时把上次的备份覆盖掉。force: true 或命令行 -f/--force 表示直接覆写。
#
# 设备选择：host 管无线端点（IP 或 IP:端口，会自动 adb connect）；serial 是 ADB 的
# 序列号（`adb devices` 第一列，如 AERF6R4517018096 或 adb-…._adb-tls-connect._tcp）。
# 两者留空则自动选择：单设备直连，多设备在交互终端列出选择（非交互报错）。
#
# 推荐模式 device-python：缺省 download_device_python 即为 true，首跑联网下载与设备
# ABI 匹配的解释器并缓存到 /data/local/tmp/andbackup-pyenv，之后自动复用；失败只会
# 明确报错，不会自动退回 host-adb。键值完整说明见 README.md 与 docs/configuration.md
# （English: docs/configuration.en.md）。
#
# 也可以备份主机自己的目录（完全不碰 ADB）：source_mode: host，此时 source_dir 是
# 主机路径（相对路径按运行目录解析，必须存在且是目录），serial/host/adb 等键一律忽略。
# 归档格式、校验与原子发布流程与设备备份完全一致（backup.py verify 能直接校验）。
# 该模式不支持 --prune-source（那是用设备端 shell 删除源条目的）。例如：
#   source_mode: host
#   source_dir: D:/Photos/2026
#   out: E:/backup/
#   compress: xz
#
# 刻意不提供的配置项：删除源条目只在命令行给出（backup.py backup --prune-source
# [--prune-dry-run]），避免配置一次后每次备份都静默删除设备上的源文件。

# adb: adb
host: ""
serial: ""
source_dir: "/storage/emulated/0/DCIM"
out: "./backups/"
compress: zstd
source_mode: device-python
log_level: info
progress_interval: 1
show_rate: true
# force: false   # 目标文件已存在时直接覆写（等同命令行 -f/--force），默认 false
